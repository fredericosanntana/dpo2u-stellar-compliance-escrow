[workspace]
exclude = ["tools/midnight-export"]
resolver = "2"
members = [
    "contracts/circom-verifier",
    "contracts/midnight-verifier",
    "contracts/compliance-gate",
    "contracts/compliance-escrow",
    "crates/midnight-verifier-core",
]

[workspace.dependencies]
soroban-sdk = "=27.0.6"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true

# the Midnight verifier is compute bound in wasm: optimize it for speed
[profile.release.package.midnight-verifier]
opt-level = 3
[profile.release.package.midnight-verifier-core]
opt-level = 3
[profile.release.package.blake2b_simd]
opt-level = 3
