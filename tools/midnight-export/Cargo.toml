[package]
name = "midnight-export"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Exports a Midnight (midnight-zk-stdlib 2.4.0) verifying key to the SVK format and checks the no_std verifier against the official one"

# Standalone: pulls the full Midnight proving stack, kept out of the contract workspace.
[workspace]

[dependencies]
midnight-verifier-core = { path = "../../crates/midnight-verifier-core", features = ["std"] }
midnight-zk-stdlib = "=2.4.0"
midnight-proofs = { version = "=0.8.2", default-features = false, features = ["circuit-params", "committed-instances"] }
midnight-circuits = "=7.3.0"
midnight-curves = "=0.3.1"
ff = "0.13"
group = "0.13"
blake2b_simd = "1"
rand = "0.8"
rand_chacha = "0.3"
hex = "0.4"
midnight-transient-crypto = "=3.1.0"
midnight-zkir = "=2.2.0"
midnight-serialize = "1"
pollster = "0.4"

[profile.release]
debug = false
