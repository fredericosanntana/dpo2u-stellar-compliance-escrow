[package]
name = "midnight-verifier"
version = "0.1.0"
edition = "2021"
rust-version = "1.91.1"
description = "Verifies Midnight (midnight-proofs 0.8.2: Plonk + KZG over BLS12-381) proofs inside Soroban"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true, features = ["alloc"] }
midnight-verifier-core = { path = "../../crates/midnight-verifier-core" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils", "alloc"] }
